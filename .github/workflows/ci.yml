name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the code. A step that runs something it shouldn't (a
# changed dependency, say) gets a token that can't push or change settings.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it makes
# out of date, instead of both running to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Pinned, not ubuntu-latest, which moves to Ubuntu 26.04 from 2026-10-19:
    # CI changes operating system when we choose to, not underneath a push.
    # 24.04 is the image ubuntu-latest has given CI until now.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # Render's (runtime.txt), which the locks are made for
      # The server's requirements, the worker's and the test tools, at the
      # versions the server and the worker install.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # Mistakes that break code when it runs, such as a name that isn't
      # defined, which a test misses unless it runs that very line.
      # ruff.toml has the rules.
      - name: Lint
        run: ruff check .
      # Known vulnerabilities in anything the server, the worker or the tests
      # install: requirements-dev.txt has all of it, at the same versions.
      # Each one ignored is a decision, with its reason:
      # - CVE-2026-114603, in opentelemetry-api below 1.45.1, which the
      #   worker's LiveKit 1.8.6 needs. A long tracestate header on a request
      #   costs seconds of CPU, but only where tracing is set up. The server,
      #   which takes requests from the internet, sets up none
      #   (tests/test_ci_settings.py); the worker takes none from it. Drop
      #   this once LiveKit allows 1.45.1.
      - name: Audit dependencies
        run: pip-audit --disable-pip --require-hashes -r requirements-dev.txt --ignore-vuln CVE-2026-114603
      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-that-is-definitely-long-enough-1234567890
          DEBUG: "true"
        run: pytest -q

  # Builds a database from empty with the migrations, as every Render deploy
  # does, and checks it. The tests use SQLite built from the models, so they
  # never saw two migrations clash on Postgres, or a column too narrow for
  # what the app stores in it.
  migrations:
    runs-on: ubuntu-24.04  # pinned, as for the backend job
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resumate
          POSTGRES_PASSWORD: resumate
          POSTGRES_DB: resumate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://resumate:resumate@localhost:5432/resumate
      SECRET_KEY: ci-secret-key-that-is-definitely-long-enough-1234567890
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The server's own install, as on Render, so the app starting below
      # shows it lacks nothing the server needs.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migrate an empty database
        run: alembic upgrade head
      - name: The schema matches the models
        run: alembic check
      - name: The app starts on it
        run: python -c "import asyncio, main; from app.core.database import init_db; asyncio.run(init_db())"
      - name: The migrations roll back and forward
        run: alembic downgrade base && alembic upgrade head

  frontend:
    runs-on: ubuntu-24.04  # pinned, as for the backend job
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The major Render builds the site with: frontend/package.json's
          # engines range resolves to the newest 24.x.
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      # Known vulnerabilities, high or critical, in what the site is built
      # from or runs. Moderate ones don't stop it: the four left now are in
      # ESLint, a development tool that never reaches the site.
      - name: Audit dependencies
        run: npm audit --audit-level=high
      # Lint before build. no-undef is the rule that matters here: a real
      # ReferenceError shipped because a context function was called without
      # being destructured, and a bundler cannot catch that — the reference is
      # only resolved when the handler runs.
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  # The interview worker's image, as Fly.io builds it (backend/fly.toml): a
  # change that breaks it shows here, not at the next deploy. The worker
  # must import in it; it isn't started, which needs LiveKit's keys.
  worker-image:
    runs-on: ubuntu-24.04  # pinned, as for the backend job
    steps:
      - uses: actions/checkout@v7
      - name: Build the worker's image
        run: docker build --tag resumate-worker --file backend/Dockerfile.agent backend
      - name: The worker imports in it
        run: docker run --rm --entrypoint python resumate-worker -c "import interview_agent"

  # Secrets, such as an API key, in the commits a push or pull request adds.
  # The history before them is known and left as it is. A finding is printed
  # with the secret itself hidden, and nothing is kept as an artifact: the
  # repository is public.
  secrets:
    runs-on: ubuntu-24.04  # pinned, as for the backend job
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks' own release, checked against the checksum it publishes.
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push's earlier commit can be missing (a branch's first push):
          # then the newest commit alone.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          else
            range="-1 $HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="$range" .
