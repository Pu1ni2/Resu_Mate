# fly.toml — ResuMate Interview Agent (background worker, no HTTP)
app = 'resumate-interview-agent'
primary_region = 'iad'

# On a deploy, Fly asks the worker to stop, then ends it after kill_timeout.
# The worker takes no new interviews and finishes the ones under way, so it
# gets Fly's longest wait, 5 minutes. Deploy it between interviews: a longer
# one would still be cut.
kill_signal = 'SIGTERM'
kill_timeout = '300s'

[build]
  dockerfile = 'Dockerfile.agent'

# Its settings are set with fly secrets set NAME=value, not written here:
# BACKEND_URL, the API's address (https://<your API>.onrender.com), and
# AGENT_SHARED_SECRET, the API's own value, without which it doesn't start;
# then OPENAI_API_KEY, LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
# SIMLI_API_KEY and SIMLI_FACE_ID. (BACKEND_URL was written here, so a moved
# API kept being sent its transcripts at the old address.)

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
