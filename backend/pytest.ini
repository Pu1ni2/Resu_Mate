[pytest]
testpaths = tests
python_files = test_*.py
# backend/ on the import path, so conftest's `import main` and `from app ...`
# work however pytest is started. `python -m pytest` adds the current folder by
# itself; the bare `pytest` that CI runs does not, so CI never got past
# conftest ("No module named 'app'", exit code 4).
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
