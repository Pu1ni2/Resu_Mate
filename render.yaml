# render.yaml — Render Blueprint for ResuMate AI
# Place in project root for one-click deploy.
#
# Deploys two services + a Postgres database, all on Render's free plans:
#   1. resumate-backend       — FastAPI API (web service)
#   2. resumate-frontend      — Vite static site
#   3. resumate-db (Postgres) — persistent storage; without this the backend
#                                falls back to ephemeral SQLite that wipes on
#                                every deploy.
#
# Free-plan limits worth knowing (see backend/DEPLOY.md):
#   - the backend sleeps after about 15 idle minutes; the next request wakes
#     it, which takes up to a minute;
#   - the free database is deleted 30 days after it is created, so back it up;
#   - background workers have no free plan, so the avatar interview worker is
#     not deployed here (see the commented block at the end). Interviews run
#     voice-only, which needs no worker.

databases:
  - name: resumate-db
    plan: free
    databaseName: resumate
    user: resumate

services:
  # Backend API
  - type: web
    name: resumate-backend
    runtime: python
    rootDir: backend
    # Install deps, then run any pending alembic migrations. Idempotent — a
    # deploy with no new migrations is a no-op. The app refuses to start on a
    # Postgres that isn't migrated to the newest revision.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Answers 503 when the database can't be reached, so a broken deploy shows.
    healthCheckPath: /health
    envVars:
      # Pin Python to 3.12 so pip resolves pre-built wheels for tokenizers,
      # chromadb, langchain-* etc. Python 3.14 has no wheels for tokenizers
      # yet, which forces a Rust source build that fails on Render's
      # read-only Cargo cache. Both runtime.txt AND this env var are kept in
      # sync — Render honours the env var even when the runtime file is
      # ignored due to a sticky cached version on an existing service.
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: resumate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_SHARED_SECRET
        generateValue: true
      # Never true in production: debug mode returns sign-in codes in responses.
      - key: DEBUG
        value: "false"
      # The frontend's public URL, for the links in emails (invitations,
      # password resets). Also allowed by CORS.
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: REALTIME_MODEL
        value: gpt-realtime-2
      - key: REALTIME_VOICE
        value: marin
      - key: REALTIME_MAX_TOTAL_MINUTES
        value: "8"
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Find Candidates. SOURCER_MODEL and the prices are optional.
      - key: SOURCER_MODEL
        sync: false
      - key: SOURCER_PRICE_IN_PER_1M
        sync: false
      - key: SOURCER_PRICE_OUT_PER_1M
        sync: false
      - key: SOURCER_MAX_GITHUB
        value: "300"
      - key: SOURCER_MAX_WEB
        value: "30"
      # Email (sign-in codes, invitations). FROM_EMAIL must be a sender
      # SendGrid has verified, or every email is refused.
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      # Optional: one shared Calendly account for the Schedule tool.
      - key: CALENDLY_TOKEN
        sync: false
      # Optional: keep original résumé files in S3-compatible storage. Left
      # blank, uploads keep only their extracted text.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Avatar interviews: off until the worker below is deployed. With it
      # off, every interview runs voice-only.
      - key: AVATAR_INTERVIEWS
        value: "false"
      # Only for avatar interviews, which also need the worker below.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: SIMLI_FACE_ID
        sync: false
    plan: free

  # Frontend Static Site
  - type: web
    name: resumate-frontend
    runtime: static
    rootDir: frontend
    # npm ci installs exactly the lock file, as CI does.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free

  # LiveKit interview worker, for avatar interviews. Render has no free plan
  # for background workers, so it isn't deployed by default. To add it,
  # uncomment this block and pick a paid plan (starter). BACKEND_URL is the
  # backend's external URL, and AGENT_SHARED_SECRET must be the backend's
  # value: copy it from the backend's Environment tab.
  #
  # - type: worker
  #   name: resumate-interview
  #   runtime: python
  #   rootDir: backend
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python interview_agent.py start
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: 3.12.8
  #     - key: BACKEND_URL
  #       sync: false
  #     - key: AGENT_SHARED_SECRET
  #       sync: false
  #     - key: OPENAI_API_KEY
  #       sync: false
  #     - key: LIVEKIT_URL
  #       sync: false
  #     - key: LIVEKIT_API_KEY
  #       sync: false
  #     - key: LIVEKIT_API_SECRET
  #       sync: false
  #     - key: SIMLI_API_KEY
  #       sync: false
  #     - key: SIMLI_FACE_ID
  #       sync: false
  #   plan: starter
