# render.yaml — Render Blueprint for ResuMate AI
# Place in project root for one-click deploy.
#
# Deploys two services + a Postgres database, all on Render's free plans:
#   1. resumate-backend       — FastAPI API (web service)
#   2. resumate-frontend      — Vite static site
#   3. resumate-db (Postgres) — persistent storage; without this the backend
#                                falls back to ephemeral SQLite that wipes on
#                                every deploy.
#
# Free-plan limits worth knowing (see backend/DEPLOY.md):
#   - the backend sleeps after about 15 idle minutes; the next request wakes
#     it, which takes up to a minute;
#   - the free database expires 30 days after it is created, and Render deletes
#     it 14 days later unless it is upgraded, so back it up;
#   - background workers have no free plan, so the avatar interview worker is
#     not deployed here (see the commented block at the end). Interviews run
#     voice-only, which needs no worker.

databases:
  - name: resumate-db
    plan: free
    databaseName: resumate
    user: resumate

services:
  # Backend API
  - type: web
    name: resumate-backend
    runtime: python
    rootDir: backend
    # Deploy a commit only once CI has passed on it, never one whose tests
    # (or audits) fail. A service made by hand in the dashboard ignores this
    # file: there, set Auto-Deploy to "After CI Checks Pass" (DEPLOY.md).
    autoDeployTrigger: checksPass
    # Install deps, then run any pending alembic migrations. requirements.txt
    # pins every package to one version, checked against its hashes (it's
    # made from requirements.in). The migrations are idempotent — a deploy
    # with no new migrations is a no-op. The app refuses to start on a
    # Postgres that isn't migrated to the newest revision.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # Answers 503 when the database can't be reached, so a broken deploy shows.
    healthCheckPath: /health
    envVars:
      # Pin Python to 3.12, the version CI tests on. It was pinned first
      # because chromadb's tokenizers had no Python 3.14 wheels, which forced
      # a Rust source build that fails on Render's read-only Cargo cache;
      # chromadb is gone. Both runtime.txt AND this env var are kept in
      # sync — Render honours the env var even when the runtime file is
      # ignored due to a sticky cached version on an existing service.
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: resumate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_SHARED_SECRET
        generateValue: true
      # Never true in production: debug mode returns sign-in codes in responses.
      - key: DEBUG
        value: "false"
      # The frontend's public URL, for the links in emails (invitations,
      # password resets), and the site CORS lets call the API. Required: the
      # backend doesn't start without it.
      - key: FRONTEND_URL
        sync: false
      # Optional: other sites allowed to call the API, comma-separated.
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: REALTIME_MODEL
        value: gpt-realtime-2
      - key: REALTIME_VOICE
        value: marin
      - key: REALTIME_MAX_TOTAL_MINUTES
        value: "8"
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Find Candidates. SOURCER_MODEL and the prices are optional.
      - key: SOURCER_MODEL
        sync: false
      - key: SOURCER_PRICE_IN_PER_1M
        sync: false
      - key: SOURCER_PRICE_OUT_PER_1M
        sync: false
      - key: SOURCER_MAX_GITHUB
        value: "300"
      - key: SOURCER_MAX_WEB
        value: "30"
      # Email (sign-in codes, invitations). FROM_EMAIL must be a sender
      # SendGrid has verified, or every email is refused.
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      # Optional: one shared Calendly account for the Schedule tool.
      - key: CALENDLY_TOKEN
        sync: false
      # Optional: keep original résumé files in S3-compatible storage. Left
      # blank, uploads keep only their extracted text.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Avatar interviews: off until the worker below is deployed. With it
      # off, every interview runs voice-only.
      - key: AVATAR_INTERVIEWS
        value: "false"
      # Only for avatar interviews, which also need the worker below.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: SIMLI_FACE_ID
        sync: false
    plan: free

  # Frontend Static Site
  - type: web
    name: resumate-frontend
    runtime: static
    rootDir: frontend
    # Only once CI has passed, as for the backend.
    autoDeployTrigger: checksPass
    # npm ci installs exactly the lock file, as CI does.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    # Hashed files under /assets get a new name when they change, so
    # browsers keep them for a year; everything else, the page above all,
    # is checked again each time, so a deploy shows at once.
    # The rest keep visitors safe:
    #   - HTTPS only;
    #   - no guessing a file's type;
    #   - no framing by other sites;
    #   - the camera and microphone for this site alone (the interviews);
    #   - a CSP that blocks only what the app never does: plugins, a
    #     foreign <base>, forms sent elsewhere.
    # A full CSP, for scripts and connections, waits until error tracking
    # can collect its reports.
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # No plan: a static site has none, and Render's schema refuses one.

  # LiveKit interview worker, for avatar interviews. Render has no free plan
  # for background workers, so it isn't deployed by default. To add it,
  # uncomment this block and pick a paid plan (starter). BACKEND_URL is the
  # backend's external URL, and AGENT_SHARED_SECRET must be the backend's
  # value: copy it from the backend's Environment tab. It installs its own
  # requirements: LiveKit isn't in the backend's.
  #
  # - type: worker
  #   name: resumate-interview
  #   runtime: python
  #   rootDir: backend
  #   autoDeployTrigger: checksPass
  #   buildCommand: pip install -r requirements-agent.txt
  #   startCommand: python interview_agent.py start
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: 3.12.8
  #     - key: BACKEND_URL
  #       sync: false
  #     - key: AGENT_SHARED_SECRET
  #       sync: false
  #     - key: OPENAI_API_KEY
  #       sync: false
  #     - key: LIVEKIT_URL
  #       sync: false
  #     - key: LIVEKIT_API_KEY
  #       sync: false
  #     - key: LIVEKIT_API_SECRET
  #       sync: false
  #     - key: SIMLI_API_KEY
  #       sync: false
  #     - key: SIMLI_FACE_ID
  #       sync: false
  #   plan: starter
