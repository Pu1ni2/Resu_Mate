# render.yaml — Render Blueprint for ResuMate AI
# Place in project root for one-click deploy.
#
# Deploys three services + a Postgres database:
#   1. resumate-backend       — FastAPI API (web service)
#   2. resumate-frontend      — Vite static site
#   3. resumate-interview     — LiveKit worker for the avatar interview agent
#                                (run as a separate worker so it can stay
#                                 connected to LiveKit without blocking the API)
#   4. resumate-db (Postgres) — persistent storage; without this the backend
#                                falls back to ephemeral SQLite that wipes on
#                                every deploy.

databases:
  - name: resumate-db
    plan: free
    databaseName: resumate
    user: resumate

services:
  # Backend API
  - type: web
    name: resumate-backend
    runtime: python
    rootDir: backend
    # Install deps, then run any pending alembic migrations. Idempotent — a
    # deploy with no new migrations is a no-op. Without this, the fresh DB
    # has only what Base.metadata.create_all builds, which skips the indexes
    # and the interview.mode column added in migrations.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin Python to 3.12 so pip resolves pre-built wheels for tokenizers,
      # chromadb, langchain-* etc. Python 3.14 has no wheels for tokenizers
      # yet, which forces a Rust source build that fails on Render's
      # read-only Cargo cache. Both runtime.txt AND this env var are kept in
      # sync — Render honours the env var even when the runtime file is
      # ignored due to a sticky cached version on an existing service.
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: resumate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_SHARED_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: SIMLI_FACE_ID
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
    plan: free

  # Frontend Static Site
  - type: web
    name: resumate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free

  # LiveKit interview worker. Runs as a background worker because it needs to
  # hold long-lived WebSocket connections to both LiveKit and OpenAI Realtime.
  # Shares OPENAI/LIVEKIT/SIMLI credentials with the backend and authenticates
  # to it via AGENT_SHARED_SECRET (X-Agent-Token header on /save-transcript).
  - type: worker
    name: resumate-interview
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python interview_agent.py start
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BACKEND_URL
        sync: false           # set to the resumate-backend external URL
      - key: AGENT_SHARED_SECRET
        sync: false           # must match the backend's AGENT_SHARED_SECRET
      - key: OPENAI_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SIMLI_API_KEY
        sync: false
      - key: SIMLI_FACE_ID
        sync: false
    plan: free
