       together, on the app's cream so it shows on a dark tab strip too. -->
  <rect x="-5" y="-6" width="42" height="42" rx="9" fill="#f6f3eb"/>
  <g fill="#bf4a32">
    <rect x="5" y="1" width="9" height="28" rx="1" transform="rotate(28 9.5 15)"/>
    <rect x="18" y="1" width="9" height="28" rx="1" transform="rotate(-28 22.5 15)"/>
  </g>
</svg>
