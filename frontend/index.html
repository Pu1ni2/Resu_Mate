<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ResuMate AI - Multi-Agent Hiring Platform with AI-powered resume analysis, candidate profiling, and live interviews">
    <meta name="theme-color" content="#09090B">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>

    <!-- DM Sans stays: the product still resolves --font-sans to it. Dropping it
         while the token still names it would silently fall the whole app back to
         system sans. The product font is a separate decision. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Satoshi: one family, 400 to 900, for the whole landing page. A single
         face across display and body is what most premium software marketing
         does - it reads as a considered system rather than a pairing. Weight
         does the work that a second family would otherwise do. Fontshare. -->
    <link href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@400,500,700,900&display=swap" rel="stylesheet">
    <title>ResuMate AI | Multi-Agent Hiring Platform</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
