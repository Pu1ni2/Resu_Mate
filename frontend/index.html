<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ResuMate AI - Multi-Agent Hiring Platform with AI-powered resume analysis, candidate profiling, and live interviews">
    <meta name="theme-color" content="#09090B">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- The fonts ship with the app (src/main.jsx): no page asks a font site
         for one. -->

    <!-- Every page is near-black until the app's code has run, and the homepage
         is cream, so it blinked dark on each visit. While the page is still
         empty, the homepage is painted cream instead; once the app draws it,
         studio.css takes over and the other pages are untouched. -->
    <script>if (location.pathname === '/') document.documentElement.setAttribute('data-boot', 'home');</script>
    <style>html[data-boot="home"]:has(#root:empty), html[data-boot="home"]:has(#root:empty) body { background: #f6f3eb; }</style>
    <title>ResuMate AI | Multi-Agent Hiring Platform</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
