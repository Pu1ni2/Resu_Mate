<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ResuMate brings résumé screening, AI interviews and deeper insights together in one hiring workspace.">
    <!-- The product is ResuMate everywhere, the tab and this description too. -->
    <meta name="theme-color" content="#f6f3eb">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- The fonts ship with the app (src/main.jsx): no page asks a font site
         for one. -->

    <!-- Every page is cream (theme.css). This paints the moment before the
         stylesheet has arrived the same cream, and sets the light theme before
         anything reads it. -->
    <script>document.documentElement.setAttribute('data-boot', 'studio'); document.documentElement.setAttribute('data-theme', 'light');</script>
    <style>html[data-boot="studio"]:has(#root:empty), html[data-boot="studio"]:has(#root:empty) body { background: #f6f3eb; }</style>
    <title>ResuMate — See the person. Find the fit.</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
