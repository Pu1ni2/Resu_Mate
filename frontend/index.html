<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ResuMate AI - Multi-Agent Hiring Platform with AI-powered resume analysis, candidate profiling, and live interviews">
    <meta name="theme-color" content="#09090B">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- The fonts ship with the app (src/main.jsx): no page asks a font site
         for one. -->

    <!-- Every page is near-black until the app's code has run, and the Studio
         pages (the homepage and the sign-in pages) are cream, so they blinked
         dark on each visit. While the page is still empty, they are painted
         cream instead; once the app draws them, studio.css and studio-auth.css
         take over, and the other pages are untouched. -->
    <script>if (['/', '/hiring/login', '/hiring/register', '/hiring/forgot', '/hiring/reset', '/candidate/login'].includes(location.pathname)) document.documentElement.setAttribute('data-boot', 'studio');</script>
    <style>html[data-boot="studio"]:has(#root:empty), html[data-boot="studio"]:has(#root:empty) body { background: #f6f3eb; }</style>
    <title>ResuMate AI | Multi-Agent Hiring Platform</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
