<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ResuMate AI - Multi-Agent Hiring Platform with AI-powered resume analysis, candidate profiling, and live interviews">
    <meta name="theme-color" content="#09090B">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>

    <!-- Instrument Serif: display face for the landing page. A high-contrast
         serif, deliberately not a neutral geometric sans - DM Sans, Inter and
         Geist are the three faces that make a page read as generated, and DM
         Sans was doing exactly that here. Only 400 needed; it is used large. -->
    <!-- DM Sans stays: the product still resolves --font-sans to it. Dropping it
         here while the token still names it would silently fall the whole app
         back to system sans - the same trap the unloaded 'Inter' reference set
         earlier. The product font is a separate decision from the landing page. -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Switzer: body and UI. Warmer and less institutional than Inter, and it
         is not the face every generator reaches for. Fontshare, free. -->
    <link href="https://api.fontshare.com/v2/css?f%5B%5D=switzer@400,500,600,700&display=swap" rel="stylesheet">
    <title>ResuMate AI | Multi-Agent Hiring Platform</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
